# Dependabot: weekly check for vulnerable / outdated dependencies.
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # apps/web (main React/Vite app)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      # Bundle minor + patch bumps for related libraries to keep PR noise low
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - react-router*
        update-types: [minor, patch]
      tooling:
        patterns:
          - vite
          - vite-*
          - "@vitejs/*"
          - typescript
          - "@types/*"
        update-types: [minor, patch]

  # packages/shared (workspace shared code)
  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  # Root workspace (rare, but covers root devDeps)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  # GitHub Actions itself
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
