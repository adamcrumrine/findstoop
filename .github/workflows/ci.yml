name: CI

on:
  push:
    branches: [develop, main, stoop-test, stoop-production]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      # `build` runs `tsc && vite build`, so this is the typecheck + bundle gate.
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests
        run: npm test
