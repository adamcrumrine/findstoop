<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindStoop — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1.25rem;
      border: 1px solid #e5e7eb;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #6366f1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 0.625rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    button:hover { background: #4f46e5; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FindStoop</div>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Some features may not be available until you reconnect.
    </p>
    <button onclick="window.location.reload()">Try again</button>
    <p class="hint">Previously viewed pages may still be available while offline.</p>
  </div>
</body>
</html>
