<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="14" rx="0" ry="0" fill="#008275" opacity="1"/><text x="600.0" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" font-style="normal" fill="#006e62" text-anchor="middle" opacity="1" letter-spacing="3">WHO STOOP IS BUILT FOR</text><text x="600.0" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="280" font-weight="bold" font-style="normal" fill="#008275" text-anchor="middle" opacity="1">73%</text><text x="600.0" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" font-style="normal" fill="#3A3A3C" text-anchor="middle" opacity="1">of US rental properties</text><text x="600.0" y="670" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" font-style="normal" fill="#3A3A3C" text-anchor="middle" opacity="1">are owned by individuals —</text><text x="600.0" y="740" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" font-style="normal" fill="#3A3A3C" text-anchor="middle" opacity="1">not institutions.</text><text x="600.0" y="850" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" font-style="normal" fill="#6E6E73" text-anchor="middle" opacity="1">The landlord with a handful of units has been stuck with</text><text x="600.0" y="898" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" font-style="normal" fill="#6E6E73" text-anchor="middle" opacity="1">spreadsheets and enterprise tools built for someone else.</text><text x="600.0" y="980" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" font-style="normal" fill="#006e62" text-anchor="middle" opacity="1">Stoop is built for them.</text><text x="600.0" y="1135" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" font-style="normal" fill="#6E6E73" text-anchor="middle" opacity="1">Source: US Census Bureau, Rental Housing Finance Survey</text></svg>